<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseapp.com https://*.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https: http:;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://api.imgbb.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com https://*.cloudfunctions.net;
        frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://*.google.com;" />

    <!-- Primary SEO -->
    <title>TreasureLayout — Event Management & Floor Planning</title>
    <meta name="description" content="TreasureLayout helps you manage events, organise brand booths, plan floor layouts, and track registrations — all in one place." />
    <meta name="theme-color" content="#0f0f17" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TreasureLayout — Event Management & Floor Planning" />
    <meta property="og:description" content="Manage events, organise brand booths, plan floor layouts, and track registrations — all in one place." />
    <meta property="og:site_name" content="TreasureLayout" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TreasureLayout — Event Management & Floor Planning" />
    <meta name="twitter:description" content="Manage events, organise brand booths, plan floor layouts, and track registrations." />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
